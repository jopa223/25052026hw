    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .neo-card {
            background-color: #131b2e;
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }
        
        /* Dynamic Choice Cards (3:4 Picture Ratio + Natural Text Box) */
        .option-card {
            background-color: #1e293b;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
        }

        /* Responsive Hover for Fine Pointers */
        @media (hover: hover) and (pointer: fine) {
            .option-card:hover {
                border-color: #fbbf24;
                background-color: #26334d;
                transform: translateY(-4px);
                box-shadow: 0 0 16px rgba(245, 158, 11, 0.35), 6px 8px 0px #f59e0b;
            }
            .option-card:hover .card-arrow {
                transform: translateX(5px);
                color: #fbbf24;
            }
        }

        /* Tactile Active & Selected Highlight */
        .option-card:active, .option-card.selected-card {
            border-color: #fbbf24 !important;
            background-color: #26334d !important;
            transform: translateY(2px) scale(0.96) !important;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.5), 2px 2px 0px #000000 !important;
        }
        .option-card:active .card-arrow, .option-card.selected-card .card-arrow {
            transform: translateX(5px) !important;
            color: #fbbf24 !important;
        }

        .card-arrow {
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }
        .screen.active {
            display: block;
            opacity: 1;
        }

        /* Solid Checkpoint Dots */
        .checkpoint-dot {
            background-color: #334155;
            transition: all 0.2s ease;
        }
        .checkpoint-dot.active {
            background-color: #fbbf24;
        }

        /* Modern Feature Badge */
        .feature-badge {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 2px solid #334155;
            transition: all 0.2s ease;
        }

        /* Pulsing Animated Start CTA Button */
        @keyframes subtlePulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 4px 4px 0px #000000;
            }
            50% {
                transform: scale(1.02);
                box-shadow: 6px 6px 14px rgba(245, 158, 11, 0.45);
            }
        }
        .btn-pulse {
            animation: subtlePulse 2s infinite ease-in-out;
        }
        .btn-pulse:hover {
            animation: none;
        }
    </style>
</head>

            { id: 29, question: "Ти бачиш, що на локації немає ворогів. Що зробиш?", options: [{ text: "Почнеш шукати те, що тут заховано?", type: "E", img: "images/q29_a.jpg" }, { text: "Підеш туди, де є з ким битися?", type: "K", img: "images/q29_b.jpg" }] },
            { id: 30, question: "Яку характеристику прокачаєш першою?", options: [{ text: "Інтелект", type: "E", img: "images/q30_a.jpg" }, { text: "Силу", type: "K", img: "images/q30_b.jpg" }] },

            { id: 37, question: "Ти можеш отримати одну з двох нагород:", options: [{ text: "+2 рівні персонажа одразу", type: "A", img: "images/q37_a.jpg" }, { text: "Амулет, який дає +50% швидкості атаки по інших гравцях", type: "K", img: "images/q37_b.jpg" }] },
            { id: 38, question: "Ти можеш отримати одну нагороду", options: [{ text: "+1000 золота", type: "A", img: "images/q38_a.jpg" }, { text: "Зілля, яке робить невидимим на 10 секунд", type: "K", img: "images/q38_b.jpg" }] },
            { id: 39, question: "Що принесло б більше задоволення?", options: [{ text: "Побачити своє ім'я на першому місці в таблиці лідерів", type: "A", img: "images/q39_a.jpg" }, { text: "Перемогти найкращого друга в дуелі 1v1", type: "K", img: "images/q39_b.jpg" }] },
            { id: 40, question: "Ти можеш обрати один артефакт:", options: [{ text: "Артефакт із рандомним бонусом від +10% до +100%?", type: "E", img: "images/q40_a.jpg" }, { text: "Артефакт із гарантованим бонусом +50%?", type: "A", img: "images/q40_b.jpg" }] },
            // NEW QUESTION 41 (E vs A)
            { id: 41, question: "Який бонус здається крутішим?", options: [{ text: "🎲 15% шанс знайти рідкісний предмет замість звичайного", type: "E", img: "images/q41_a.jpg" }, { text: "💰 +25% золота з переможених монстрів", type: "A", img: "images/q41_b.jpg" }] },
            // NEW QUESTION 42 (S vs E)
            { id: 42, question: "Який бонус здається крутішим?", options: [{ text: "💚 Відновити +40% здоров'я союзникам", type: "S", img: "images/q42_a.jpg" }, { text: "🗝 25% шанс знайти ключ від прихованої скрині", type: "E", img: "images/q42_b.jpg" }] }
        ];

        const TYPE_DATA = {
            A: { name: "Achiever", icon: "🏆", color: "bg-yellow-500", text: "text-yellow-400" },
            S: { name: "Socializer", icon: "🤝", color: "bg-green-500", text: "text-green-400" },
            E: { name: "Explorer", icon: "🧭", color: "bg-cyan-500", text: "text-cyan-400" },
            K: { name: "Killer", icon: "⚔️", color: "bg-red-500", text: "text-red-400" }
        };

        const DUAL_DESCRIPTIONS = {
            "A/S": "Ти любиш досягати конкретних результатів, але найбільше задоволення отримуєш, коли робиш це разом із командою та друзями.",
            "A/E": "Ти максималіст, який прагне закрити гру на 100%, вивчити кожну таємну локацію та отримати всі можливі ачівки.",
            "A/K": "Твій стиль — домінувати за рахунок ідеальної прокачки, топового шмоту та чистої переваги у характеристиках.",
            "S/A": "Для тебе важливі друзі та спільна гра, але ти завжди прагнеш до того, щоб ваша група досягала топових результатів.",
            "S/E": "Ти душа компанії, яка любить ділитися відкриттями, вивчати лор та досліджувати ігрові світи разом із товаришами.",
            // TEXT REPLACEMENT: PvP to 1v1
            "S/K": "Ти граєш заради взаємодії з іншими гравцями, але твоя улюблена форма зв'язку — це виклики, суперництво та драма.",
            "E/A": "Ти дослідник у душі, але з чітким механічним фокусом: знайти найрідкісніші речі й зібрати повний сет колекцій.",
            "E/S": "Ти шукач пригод, якому найбільше подобається ділитися секретами ігрового світу та допомагати іншим орієнтуватися у грі.",
            "E/K": "Ти хитрий мисливець. Знаєш кожну стежку та баг карти, щоб використовувати знання світу для несподіваних атак.",
            // TEXT REPLACEMENT: PvP to 1v1
            "K/A": "Ти безжальний змагальник, для якого перемога над іншим гравцем є головним показником власного високого рівня.",
            // TEXT REPLACEMENT: PvP to 1v1
            "K/S": "Ти шукач гострих емоцій. Бій для тебе — це головний спосіб соціальної взаємодії та отримання авторитету.",
            "K/E": "Ти непередбачуваний тактик. Тобі подобається заманювати ворогів у пастки, використовувати ландшафт і грати не за правилами."
        };

        let activeQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let scores = { S: 0, E: 0, A: 0, K: 0 };
        let audioCtx = null;

        function clearCardFocus() {
            if (document.activeElement) {
                document.activeElement.blur();
            }
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            if (btnA) {
                btnA.blur();
                btnA.classList.remove('selected-card');
            }
            if (btnB) {
                btnB.blur();
                btnB.classList.remove('selected-card');
            }
        }

        function triggerHaptic(type = 'tap') {
            if (navigator && typeof navigator.vibrate === 'function') {
                if (type === 'tap') navigator.vibrate(12);
                else if (type === 'victory') navigator.vibrate([20, 50, 20, 50, 30]);
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
        }

        function toggleDescription() {
            triggerHaptic('tap');
            const descBox = document.getElementById('combo-desc');
            const btnText = document.getElementById('desc-btn-text');
            
            if (descBox.classList.contains('hidden')) {
                descBox.classList.remove('hidden');
                btnText.innerText = "📜 СХОВАТИ ОПИС";
            } else {
                descBox.classList.add('hidden');
                btnText.innerText = "📖 ДИВИТИСЬ ОПИС";
            }
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function shuffleArray(array) {
            const arr = JSON.parse(JSON.stringify(array));
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            triggerHaptic('tap');
            initAudio();
            currentIndex = 0;
            userAnswers = [];
            scores = { S: 0, E: 0, A: 0, K: 0 };
            
            activeQuestions = shuffleArray(rawQuestions);

            showScreen('game-screen');
            loadQuestion();
        }

        function updateCheckpointsAndMarker(currentNum) {
            // UPDATED: Adapt checkpoints to 42 questions
            const total = 42; 
            const pct = ((currentNum - 1) / (total - 1)) * 100;
            
            document.getElementById('progress-line').style.width = `${pct}%`;

            const cps = [1, 10, 20, 30, 40];
            cps.forEach(num => {
                const el = document.getElementById(`cp-${num}`);
                if (currentNum >= num) el.classList.add('active');
                else el.classList.remove('active');
            });
        }

        function loadCardImage(imgId, placeholderId, imgSrc) {
            const img = document.getElementById(imgId);
            const placeholder = document.getElementById(placeholderId);

            img.onload = () => {
                img.classList.remove('hidden');
                placeholder.classList.add('hidden');
            };
            img.onerror = () => {
                img.classList.add('hidden');
                placeholder.classList.remove('hidden');
            };

            img.src = imgSrc;
        }

        function loadQuestion() {
            clearCardFocus();
            const q = activeQuestions[currentIndex];
            
            const currentNum = currentIndex + 1;
            document.getElementById('q-text').innerText = q.question;

            updateCheckpointsAndMarker(currentNum);

            const optA = q.options[0];
            const optB = q.options[1];

            document.getElementById('text-a').innerText = optA.text;
            loadCardImage('img-a', 'placeholder-a', optA.img);

            document.getElementById('text-b').innerText = optB.text;
            loadCardImage('img-b', 'placeholder-b', optB.img);

            document.getElementById('btn-a').onclick = () => selectOption('btn-a', optA.type);
            document.getElementById('btn-b').onclick = () => selectOption('btn-b', optB.type);
        }

        function selectOption(btnId, type) {
            const btn = document.getElementById(btnId);
            if (btn) btn.classList.add('selected-card');

            triggerHaptic('tap');
            playSound(500, 0.1);
            
            userAnswers.push(type);
            scores[type]++;

            setTimeout(() => {
                if (currentIndex < activeQuestions.length - 1) {
                    currentIndex++;
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 140);
        }

        function goBack() {
            clearCardFocus();
            triggerHaptic('tap');
            playSound(350, 0.1);
            
            if (currentIndex > 0) {
                currentIndex--;
                const lastAnswer = userAnswers.pop();
                if (lastAnswer) scores[lastAnswer]--;
                loadQuestion();
            } else {
                showScreen('start-screen');
            }
        }

        function showResults() {
            clearCardFocus();
            triggerHaptic('victory');
            triggerConfetti();
            playSound(700, 0.35);
            showScreen('results-screen');

            document.getElementById('combo-desc').classList.add('hidden');
            document.getElementById('desc-btn-text').innerText = "📖 ДИВИТИСЬ ОПИС";

            const sortedTypes = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            const primary = sortedTypes[0];
            const secondary = sortedTypes[1];

            const pData = TYPE_DATA[primary];
            const sData = TYPE_DATA[secondary];

            // UPDATED: adapt max score to 21 (42 total questions / 2 choices per pair)
            const maxScore = 21; 
            const primaryPct = Math.round((scores[primary] / maxScore) * 100);
            const secondaryPct = Math.round((scores[secondary] / maxScore) * 100);

            document.getElementById('combo-title').innerText = `${pData.name} / ${sData.name}`;

            const key = `${primary}/${secondary}`;
            const descText = DUAL_DESCRIPTIONS[key] || `${pData.name} із сильно вираженими рисами ${sData.name}.`;
            document.getElementById('combo-desc').innerText = descText;

            document.getElementById('p-icon').innerText = pData.icon;
            document.getElementById('p-name').innerText = pData.name;
            document.getElementById('p-pct').innerText = `${primaryPct}%`;

            document.getElementById('s-icon').innerText = sData.icon;
            document.getElementById('s-name').innerText = sData.name;
            document.getElementById('s-pct').innerText = `${secondaryPct}%`;

            const barsContainer = document.getElementById('bars-container');
            barsContainer.innerHTML = '';

            sortedTypes.slice(2).forEach(t => {
                const val = scores[t];
                // UPDATED: adapt max score to 21
                const pct = Math.round((val / maxScore) * 100);
                const info = TYPE_DATA[t];

                const row = document.createElement('div');
                row.className = 'space-y-1';
                row.innerHTML = `
                    <div class="flex justify-between items-center font-black text-xs">
                        <span class="flex items-center gap-1.5">${info.icon} ${info.name}</span>
                        <span class="${info.text}">${pct}%</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2.5 rounded-full border border-slate-700 overflow-hidden p-0.5">
                        <div class="h-full ${info.color} rounded-full" style="width: ${pct}%;"></div>
                    </div>
                `;
                barsContainer.appendChild(row);
            });
        }
    </script>
