<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Word Run: Magic Pack</title>
    <style>
        :root {
            --bg-color: #090714;
            --panel-color: #130f26;
            --border-color: #000000;
            --text-color: #f1f5f9;
            --accent-pink: #ec4899;
            --accent-blue: #a855f7;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        header h1 {
            font-size: 2rem; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 3px 3px 0px var(--border-color); -webkit-text-stroke: 1.5px var(--border-color);
            color: var(--accent-pink); margin-bottom: 20px; text-align: center;
        }

        .engine-container {
            width: 100%; max-width: 650px; background: var(--panel-color);
            border: 4px solid var(--border-color); box-shadow: 7px 7px 0px var(--border-color);
            border-radius: 16px; padding: 25px; min-height: 525px; display: flex; flex-direction: column;
        }

        /* PROGRESS MAP */
        .map-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .map-node {
            background: #1c153a; border: 3px solid var(--border-color); padding: 12px 20px;
            border-radius: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 3px 3px 0px var(--border-color);
        }
        .map-node.locked { opacity: 0.3; cursor: not-allowed; background: #0c091f; }
        .map-node.active { border-color: var(--accent-blue); background: #6b21a8; color: #fff; animation: pulse 1.5s infinite; }
        .map-node.completed { background: #065f46; color: #a7f3d0; border-color: var(--accent-green); }

        /* FLIP CARD */
        .flip-container { perspective: 1000px; width: 100%; max-width: 350px; height: 230px; margin: 30px auto; cursor: pointer; }
        .flip-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s ease; border: 4px solid var(--border-color); border-radius: 12px; box-shadow: 5px 5px 0px var(--border-color); }
        .flip-card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; border-radius: 8px; }
        .card-front { background: #1c153a; color: var(--accent-pink); font-size: 1.8rem; font-weight: 900; letter-spacing: 1px; }
        .card-back { background: #0c091f; transform: rotateY(180deg); justify-content: space-between; }

        /* DRAG AND DROP MATCHING */
        .dd-container { display: flex; gap: 15px; margin-top: 15px; }
        .dd-column { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        .drag-item { background: #3b2d75; border: 2px solid var(--border-color); padding: 10px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: grab; text-align: center; box-shadow: 2px 2px 0px var(--border-color); color: #ffffff; }
        .drop-zone { background: #0c091f; border: 2px dashed #6b21a8; min-height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 5px; font-size: 0.85rem; color: #6b21a8; font-weight: 700; }
        .drop-zone.hovered { border-color: var(--accent-blue); background: #1c153a; }

        /* STYLISH SELECTS FOR GAP FILL */
        .story-select {
            background: #0c091f; border: 2px solid var(--border-color); color: #ffffff; 
            padding: 4px 8px; border-radius: 6px; font-size: 1rem; font-weight: 700;
            width: 135px; display: inline-block; margin: 0 4px; cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* WORD ORDER */
        .block-pool { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; justify-content: center; width: 100%; }
        .word-block { 
            background: #3b2d75; border: 2px solid var(--border-color); padding: 10px 16px; 
            border-radius: 8px; font-weight: 700; cursor: pointer; color: #fff; 
            box-shadow: 3px 3px 0px var(--border-color); display: inline-block; width: auto;
        }
        .word-block.selected { background: var(--accent-blue); color: #fff; border-color: #fff; }
        .workspace-line { min-height: 55px; background: #0c091f; border: 3px dashed #6b21a8; border-radius: 10px; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 700; }

        /* CENTERED TINDER BOX */
        .true-false-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .tinder-box { background: #1c153a; border: 3px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center; font-size: 1.2rem; font-weight: 700; margin: 25px 0; color: #fff; box-shadow: 5px 5px 0px var(--border-color); width: 100%; max-width: 455px; }
        .swipe-actions { display: flex; gap: 20px; justify-content: center; width: 100%; }

        /* CHAT & OPTIONS */
        .chat-msg { background: #0c091f; border: 2px solid var(--border-color); padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 1.1rem; color: #ffffff; box-shadow: 2px 2px 0px var(--border-color); }
        .chat-msg.npc::before { content: "🧙‍♂️ Archmage: "; color: var(--accent-pink); font-weight: 800; }
        .option-btn { width: 100%; background: #1c153a; border: 2px solid var(--border-color); padding: 14px; text-align: left; border-radius: 8px; font-weight: 600; margin-bottom: 8px; cursor: pointer; color: #ffffff; box-shadow: 2px 2px 0px var(--border-color); }
        .option-btn:hover { background: #2a2054; border-color: var(--accent-blue); }

        /* SMOOTH TIMER BAR */
        .timer-bar { width: 100%; height: 10px; background: #0c091f; border: 2px solid #000; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
        .timer-fill { width: 100%; height: 100%; background: var(--accent-orange); transition: width 0.1s linear; }

        /* BOSS HEALTH BAR */
        .boss-hp-bar { width: 100%; height: 14px; background: #3b2d75; border: 2px solid #000; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
        .boss-hp-fill { width: 100%; height: 100%; background: var(--accent-pink); transition: width 0.3s ease; }

        /* UTILITY BUTTONS */
        .footer-nav { display: flex; justify-content: space-between; margin-top: auto; padding-top: 20px; width: 100%; }
        button.action-btn { padding: 12px 24px; font-weight: 900; text-transform: uppercase; border: 3px solid var(--border-color); border-radius: 8px; box-shadow: 3px 3px 0px var(--border-color); cursor: pointer; }
        button.action-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0px var(--border-color); }
        .btn-gray { background: #4b5563; color: #fff; }
        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-pink { background: var(--accent-pink); color: #fff; }
        .btn-purple { background: var(--accent-blue); color: #fff; }

        .hud-title { font-size: 1.2rem; font-weight: 900; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 10px; border-bottom: 3px dashed #3b2d75; padding-bottom: 8px; text-align: center; }
        .feedback-alert { padding: 12px; border-radius: 8px; font-weight: 700; border: 2px solid var(--border-color); margin-top: 15px; display: none; text-align: center; }
        .feedback-alert.ok { background: #065f46; color: #34d399; }
        .feedback-alert.fail { background: #991b1b; color: #f87171; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); } 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } }
    </style>
</head>
<body>

    <header>
        <h1>✨ Magic Word Run ✨</h1>
    </header>

    <div class="engine-container" id="engineBox"></div>

    <script>
        const runData = {
            theme: "🔮 Wizard Pack",
            words: [
                { id: "w0", word: "spellbook", translation: "книга заклинань", level: "B1", example: "Open your spellbook on page 7.", definition: "a book containing magical spells", tip: "Core item for any wizard." },
                { id: "w1", word: "sparkle", translation: "іскритися; блиск; сяйво", level: "B2", example: "The magic crystal began to sparkle.", definition: "to shine brightly with flashes of light", tip: "Can be both a verb and a noun." },
                { id: "w2", word: "enchantment", translation: "чари; зачарування; магія", level: "B2", example: "The castle was under a powerful enchantment.", definition: "a feeling of great pleasure or a magical spell", tip: "Often used to describe objects bound with magic." },
                { id: "w3", word: "fairy dust", translation: "чарівний пил; пил феї", level: "B2", example: "She threw some fairy dust to make it fly.", definition: "magical powder that causes wondrous things", tip: "Essential component for mythical illusions." },
                { id: "w4", word: "illusion", translation: "ілюзія; обман зору", level: "B2", example: "The dragon was just a clever illusion.", definition: "something that looks real but is not", tip: "A trick played on the eyes or mind." }
            ],
            gapfill: {
                text: "Deep inside the wizard's tower, Alistair carefully opened his ancient [S0]. He whispered an incantation, making the runes on the cover [S1] with violet light. To protect his artifacts, he placed a protective [S2] upon the chest. With a handful of glowing [S3], he conjured a magnificent phantasm. To anyone else, it looked real, but it was merely an [S4].",
                options: ["spellbook", "sparkle", "enchantment", "fairy dust", "illusion"]
            },
            wordorder: { scrambled: ["magic", "you", "have", "in", "you"], correct: "you have magic in you" },
            dialogue: {
                npcQuestion: "I feel like I'm completely useless and have no talent for potion crafting...",
                options: [
                    { text: "Don't say that! Close your eyes, make a wish, and remember: you have magic in you!", correct: true },
                    { text: "Don't say that! You are just a dangerous enchantment book.", correct: false },
                    { text: "Don't say that! Open your illusion immediately!", correct: false }
                ]
            },
            truefalse: { statement: "The idiom 'you have magic in you' always strictly means you can cast literal fantasy spells.", correctIs: false },
            quiz: {
                question: "Which magical sentence structure is grammatically perfect?",
                options: [
                    { text: "The wizard chanted 'Abracadabra!' and the gates opened.", correct: true },
                    { text: "The wizard chanted 'Abracadabra!' or the gates opens.", correct: false },
                    { text: "The wizard chanted 'Abracadabra!' on a fairy dusts.", correct: false }
                ]
            },
            finalBoss: {
                title: "The Archmage Trial",
                rounds: [
                    {
                        question: "What is your main tool for tracking and memorizing complex incantations?",
                        options: [
                            { text: "I keep all my spells documented inside my personal spellbook.", correct: true },
                            { text: "I usually hide them under a strange sparkle.", correct: false }
                        ]
                    },
                    {
                        question: "The ancient barrier is unbreakable! How can we lift this curse?",
                        options: [
                            { text: "We need a counter-spell to break this dark enchantment.", correct: true },
                            { text: "We should throw a giant illusion at it.", correct: false }
                        ]
                    },
                    {
                        question: "The dragon is breathing real fire! How do we run away?",
                        options: [
                            { text: "Don't panic, look closely! It's not real, it's just a grand illusion.", correct: true },
                            { text: "Don't panic, put some spellbook under your feet.", correct: false }
                        ]
                    }
                ]
            }
        };

        let completedNodes = [];
        let activeLearnCardIdx = 0;
        let bossRoundIdx = 0;
        let playerHp = 3;

        function renderEngineView() {
            const box = document.getElementById('engineBox');
            box.innerHTML = '';
            renderMap(box);
        }

        function renderMap(target) {
            target.innerHTML = `<div class="hud-title">📍 PROGRESS MAP: ${runData.theme}</div><div class="map-grid" id="mapNodesGroup"></div>`;
            const grid = document.getElementById('mapNodesGroup');

            const nodesStructure = [
                { id: "learn", name: "🌱 Learn Deck" },
                { id: "match", name: "🔗 Drag & Drop Match" },
                { id: "gapfill", name: "📝 Story Gap Fill" },
                { id: "wordorder", name: "🔀 Blocks Word Order" },
                { id: "dialogue", name: "💬 Dialogue Chat" },
                { id: "truefalse", name: "✅ True / False Tinder" },
                { id: "quiz", name: "🏆 Quiz Boss" },
                { id: "finalBoss", name: "⚔️ Final Boss: The Archmage" }
            ];

            nodesStructure.forEach((node, idx) => {
                let statusClass = "locked";
                if (completedNodes.includes(node.id)) statusClass = "completed";
                else if (idx === completedNodes.length) statusClass = "active";

                const element = document.createElement('div');
                element.className = `map-node ${statusClass}`;
                element.innerHTML = `<span>${node.name}</span> <span>${statusClass === 'completed' ? '✅' : statusClass === 'active' ? '⚡' : '🔒'}</span>`;
                
                if(statusClass === "active" || statusClass === "completed") {
                    element.onclick = () => launchNodeTask(node.id);
                }
                grid.appendChild(element);
            });
        }

        function launchNodeTask(nodeId) {
            const box = document.getElementById('engineBox');
            box.innerHTML = '';
            if (nodeId === "learn") runLearnView(box);
            if (nodeId === "match") runMatchView(box);
            if (nodeId === "gapfill") runGapFillView(box);
            if (nodeId === "wordorder") runWordOrderView(box);
            if (nodeId === "dialogue") runDialogueView(box);
            if (nodeId === "truefalse") runTrueFalseView(box);
            if (nodeId === "quiz") runQuizView(box);
            if (nodeId === "finalBoss") runFinalBossView(box);
        }

        // --- 1️⃣ LEARN DECK ---
        function runLearnView(target) {
            const currentWord = runData.words[activeLearnCardIdx];
            target.innerHTML = `
                <div class="hud-title">🌱 Learn Mode (${activeLearnCardIdx + 1}/${runData.words.length})</div>
                <div class="flip-container" onclick="document.getElementById('fCard').classList.toggle('flipped')">
                    <div class="flip-card" id="fCard">
                        <div class="card-front"><div>✨ ${currentWord.word}</div><div style="font-size:0.7rem; margin-top:10px; color:#8b5cf6;">[CLICK TO CAST FLIP]</div></div>
                        <div class="card-back">
                            <div style="font-size:1.2rem; font-weight:800; color:var(--accent-blue);">${currentWord.translation} (${currentWord.level})</div>
                            <div style="font-size:1rem; color:#ffffff; font-style:italic;">"${currentWord.example}"</div>
                            <div style="font-size:0.85rem; color:#94a3b8;">🔮 ${currentWord.tip}</div>
                        </div>
                    </div>
                </div>
                <div class="footer-nav">
                    <button class="action-btn btn-gray" onclick="activeLearnCardIdx=0; renderEngineView()">Map</button>
                    <button class="action-btn btn-pink" id="nextCardBtn">${activeLearnCardIdx === runData.words.length - 1 ? 'Finish Deck' : 'Next Card'}</button>
                </div>
            `;
            document.getElementById('nextCardBtn').onclick = () => {
                if(activeLearnCardIdx < runData.words.length - 1) { activeLearnCardIdx++; runLearnView(target); } 
                else { markNodeDone("learn"); }
            };
        }

        // --- 2️⃣ DRAG AND DROP MATCHING ---
        function runMatchView(target) {
            target.innerHTML = `
                <div class="hud-title">🔗 Drag & Drop Definitions</div>
                <div class="dd-container">
                    <div class="dd-column" id="wordsColumn"></div>
                    <div class="dd-column" id="defsColumn"></div>
                </div>
                <div class="feedback-alert" id="fAlert"></div>
                <div class="footer-nav">
                    <button class="action-btn btn-gray" onclick="renderEngineView()">Map</button>
                    <button class="action-btn btn-green" onclick="validateDragDrop()">Verify Match</button>
                </div>
            `;

            const wordsCol = document.getElementById('wordsColumn');
            const defsCol = document.getElementById('defsColumn');

            runData.words.forEach(w => {
                wordsCol.innerHTML += `
                    <div style="background:#1c153a; padding:10px; border:2px solid #000; border-radius:8px;">
                        <div style="font-weight:800; color:var(--accent-pink); margin-bottom:5px;">${w.word}</div>
                        <div class="drop-zone" data-word="${w.word}" id="zone-${w.word}">Drop definition here</div>
                    </div>
                `;
            });

            const shuffledDefs = [...runData.words].sort(() => Math.random() - 0.5);
            shuffledDefs.forEach((w, i) => {
                const item = document.createElement('div');
                item.className = "drag-item"; item.draggable = true; item.id = `drag-${i}`;
                item.innerText = w.definition; item.setAttribute('data-target-word', w.word);
                item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', e.target.id); });
                defsCol.appendChild(item);
            });

            setTimeout(() => {
                const zones = document.querySelectorAll('.drop-zone');
                zones.forEach(zone => {
                    zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('hovered'); });
                    zone.addEventListener('dragleave', () => { zone.classList.remove('hovered'); });
                    zone.addEventListener('drop', (e) => {
                        e.preventDefault(); zone.classList.remove('hovered');
                        const id = e.dataTransfer.getData('text/plain');
                        const draggedElement = document.getElementById(id);
                        if(draggedElement) { zone.innerHTML = ''; zone.appendChild(draggedElement); }
                    });
                });
            }, 100);
        }

        function validateDragDrop() {
            let pass = true;
            runData.words.forEach(w => {
                const zone = document.getElementById(`zone-${w.word}`);
                const child = zone.querySelector('.drag-item');
                if(!child || child.getAttribute('data-target-word') !== w.word) pass = false;
            });
            showFeedback(pass, "match");
        }

        // --- 3️⃣ CUSTOM GAP FILL ---
        function runGapFillView(target) {
            let storyHtml = runData.gapfill.text;
            runData.gapfill.options.forEach((opt, idx) => {
                let dropDown = `
                    <select id="gf${idx}" class="story-select">
                        <option value="">Select</option>
                        ${runData.gapfill.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>
                `;
                storyHtml = storyHtml.replace(`[S${idx}]`, dropDown);
            });

            target.innerHTML = `
                <div class="hud-title">📝 Context Story Fill</div>
                <div style="line-height:2.2; font-size:1.05rem; background:#1c153a; padding:20px; border-radius:12px; border:3px solid #000; color:#fff;">
                    ${storyHtml}
                </div>
                <div class="feedback-alert" id="fAlert"></div>
                <div class="footer-nav">
                    <button class="action-btn btn-gray" onclick="renderEngineView()">Map</button>
                    <button class="action-btn btn-green" onclick="validateGapFill()">Verify Story</button>
                </div>
            `;
        }

        function validateGapFill() {
            let pass = true;
            const answers = ["spellbook", "sparkle", "enchantment", "fairy dust", "illusion"];
            answers.forEach((ans, idx) => { if(document.getElementById(`gf${idx}`).value !== ans) pass = false; });
            showFeedback(pass, "gapfill");
        }

        // --- 4️⃣ WORD ORDER ---
        let currentBlocksOrder = [];
        function runWordOrderView(target) {
            currentBlocksOrder = [];
            target.innerHTML = `
                <div class="hud-title">🔀 Blocks Scramble Order</div>
                <div class="block-pool" id="blockPool"></div>
                <div class="workspace-line" id="workspaceLine" style="color:#fff;"></div>
                <div class="feedback-alert" id="fAlert"></div>
                <div class="footer-nav">
                    <button class="action-btn btn-pink" onclick="runWordOrderView(document.getElementById('engineBox'))">Reset</button>
                    <button class="action-btn btn-green" onclick="validateWordOrder()">Verify Path</button>
                </div>
            `;
            const pool = document.getElementById('blockPool');
            runData.wordorder.scrambled.forEach((word) => {
                const b = document.createElement('div'); b.className = "word-block"; b.innerText = word;
                b.onclick = () => {
                    if(!b.classList.contains('selected')) {
                        b.classList.add('selected'); currentBlocksOrder.push(word);
                        document.getElementById('workspaceLine').innerText = currentBlocksOrder.join(' ');
                    }
                };
                pool.appendChild(b);
            });
        }
        function validateWordOrder() { showFeedback(currentBlocksOrder.join(' ').toLowerCase() === runData.wordorder.correct, "wordorder"); }

        // --- 5️⃣ DIALOGUE ---
        function runDialogueView(target) {
            target.innerHTML = `
                <div class="hud-title">💬 Interactive Dialogue Chat</div>
                <div class="chat-msg npc">${runData.dialogue.npcQuestion}</div>
                <div id="dialogueOptions"></div>
                <div class="feedback-alert" id="fAlert"></div>
            `;
            const holder = document.getElementById('dialogueOptions');
            runData.dialogue.options.forEach(opt => {
                const btn = document.createElement('button'); btn.className = "option-btn"; btn.innerText = opt.text;
                btn.onclick = () => showFeedback(opt.correct, "dialogue");
                holder.appendChild(btn);
            });
        }

        // --- 6️⃣ TRUE / FALSE CENTERED ---
        function runTrueFalseView(target) {
            target.innerHTML = `
                <div class="true-false-screen">
                    <div class="hud-title">✅ True / False Card Swap</div>
                    <div class="tinder-box">"${runData.truefalse.statement}"</div>
                    <div class="swipe-actions">
                        <button class="action-btn btn-pink" style="width:140px;" onclick="showFeedback(false === runData.truefalse.correctIs, 'truefalse')">❌ FALSE</button>
                        <button class="action-btn btn-green" style="width:140px;" onclick="showFeedback(true === runData.truefalse.correctIs, 'truefalse')">✅ TRUE</button>
                    </div>
                    <div class="feedback-alert" id="fAlert" style="width:100%; max-width:455px;"></div>
                </div>
            `;
        }

        // --- 7️⃣ QUIZ BOSS ---
        let quizTimerInterval = null;
        function runQuizView(target) {
            target.innerHTML = `
                <div class="hud-title">🏆 Quiz Boss Encounter</div>
                <div class="timer-bar"><div class="timer-fill" id="tFill" style="width: 100%;"></div></div>
                <div class="chat-msg" style="font-weight:700; color:#fff;">${runData.quiz.question}</div>
                <div id="quizOptions"></div>
                <div class="feedback-alert" id="fAlert"></div>
            `;
            runData.quiz.options.forEach(opt => {
                const b = document.createElement('button'); b.className = "option-btn"; b.innerText = opt.text;
                b.onclick = () => { clearInterval(quizTimerInterval); showFeedback(opt.correct, "quiz"); };
                document.getElementById('quizOptions').appendChild(b);
            });

            let totalTime = 10000;
            let timeRemaining = totalTime;
            let tickRate = 100;
            
            quizTimerInterval = setInterval(() => {
                timeRemaining -= tickRate;
                let percentage = (timeRemaining / totalTime) * 100;
                document.getElementById('tFill').style.width = percentage + "%";
                if(timeRemaining <= 0) { clearInterval(quizTimerInterval); showFeedback(false, "quiz"); }
            }, tickRate);
        }

        // --- 8️⃣ HARDCORE FINAL BOSS ---
        function runFinalBossView(target) {
            if(playerHp <= 0) {
                target.innerHTML = `<div class="hud-title">💀 GAME OVER</div><p style="text-align:center; margin-top:20px;">Бос розгромив твій пул знань. Спробуй знову!</p><button class="action-btn btn-pink" style="margin-top:20px; width:100%;" onclick="playerHp=3; bossRoundIdx=0; renderEngineView()">Restart Run</button>`;
                return;
            }

            if(bossRoundIdx >= runData.finalBoss.rounds.length) {
                target.innerHTML = `<div class="hud-title">🏆 RUN CLEAR!</div><p style="text-align:center; margin-top:20px; color:var(--accent-green); font-size:1.3rem; font-weight:800;">ВІТАЄМО! Магічний пак повністю засвоєно. Нагорода: +100 XP</p><button class="action-btn btn-purple" style="margin-top:20px; width:100%;" onclick="completedNodes.push('finalBoss'); renderEngineView()">Return Victorious</button>`;
                return;
            }

            const currentRound = runData.finalBoss.rounds[bossRoundIdx];
            let hpHearts = "❤️".repeat(playerHp);

            target.innerHTML = `
                <div class="hud-title">⚔️ BOSS STAGE: ${runData.finalBoss.title}</div>
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:800;">
                    <span>ROUND: ${bossRoundIdx + 1} / 3</span>
                    <span style="color:var(--accent-pink)">YOUR HP: ${hpHearts}</span>
                </div>
                <div class="boss-hp-bar"><div class="boss-hp-fill" style="width: ${((3 - bossRoundIdx)/3)*100}%"></div></div>
                
                <div class="chat-msg npc" style="color:#ffffff;">${currentRound.question}</div>
                
                <div id="bossOptionsHolder"></div>
                <div class="feedback-alert" id="fAlert"></div>
            `;

            const holder = document.getElementById('bossOptionsHolder');
            currentRound.options.forEach(opt => {
                const b = document.createElement('button'); b.className = "option-btn"; b.innerText = opt.text;
                b.onclick = () => {
                    const alertBox = document.getElementById('fAlert'); alertBox.style.display = "block";
                    if(opt.correct) {
                        alertBox.className = "feedback-alert ok"; alertBox.innerText = "💥 Натиск Боса відбито! Магічний захист витримав.";
                        bossRoundIdx++; setTimeout(() => { runFinalBossView(target); }, 1500);
                    } else {
                        alertBox.className = "feedback-alert fail"; alertBox.innerText = "❌ Помилка! Бос пробиває захист. Мінус 1 HP.";
                        playerHp--; setTimeout(() => { runFinalBossView(target); }, 1500);
                    }
                };
                holder.appendChild(b);
            });
        }

        // --- ENGINE SYSTEMS ---
        function showFeedback(isCorrect, nodeId) {
            const alertBox = document.getElementById('fAlert');
            if(!alertBox) return; alertBox.style.display = 'block';
            if(isCorrect) {
                alertBox.className = "feedback-alert ok"; alertBox.innerText = "💥 PERFECT! Етап пройдено.";
                setTimeout(() => { markNodeDone(nodeId); }, 1200);
            } else {
                alertBox.className = "feedback-alert fail"; alertBox.innerText = "❌ Магія зірвалася! Спробуй ще раз.";
            }
        }

        function markNodeDone(nodeId) {
            if(!completedNodes.includes(nodeId)) completedNodes.push(nodeId);
            renderEngineView();
        }

        window.onload = renderEngineView;
    </script>
</body>
</html>
